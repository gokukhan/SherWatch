# SherWatch Command Center configuration
# Edit and restart the app to apply.

[server]
bind = "127.0.0.1"
port = 8787
open_browser = true

[analysis]
# Minutes to wait before the same alert (same rule + process + target) can fire again
alert_cooldown_minutes = 10
# Outbound bytes per process within 60 seconds that triggers an exfiltration alert
exfil_bytes_per_minute = 26214400     # 25 MB
# Outbound bytes per process within 5 minutes that triggers a high exfiltration alert
exfil_bytes_per_5min = 209715200      # 200 MB
# Distinct public destinations per process within 60 seconds (scan / spray detection)
many_destinations_threshold = 100
# File-exfiltration rules (R27, R28). Programs listed here may upload freely; any other program that
# sends more than file_upload_bytes_per_minute to public addresses raises a CRITICAL alert.
# Add your backup client, video-call app or game launcher here when they trip it legitimately.
approved_uploaders = ["onedrive.exe"]
file_upload_bytes_per_minute = 5242880    # 5 MB
# Uploads to a file-sharing or paste service (R28) are critical from this many bytes on one connection.
# Browsing such a site stays silent; the built-in service list can be extended with file_sharing_domains = [...]
file_sharing_min_bytes = 262144           # 256 KB
# Beacon detection: minimum number of regular intervals and max coefficient of variation
beacon_min_intervals = 6
beacon_max_cv = 0.25
# Country codes (ISO 3166-1 alpha-2) on your watch list. Connections to these raise a low alert.
watch_countries = ["KP", "IR", "RU", "CN", "SY", "BY"]
# Reverse-DNS lookups for IPs without a captured DNS query (uses your normal resolver)
reverse_dns = true

[intel]
# Hours between feed refreshes
refresh_hours = 6
# Minimum IPsum score (number of blocklists that list the IP) to treat as malicious
ipsum_min_score = 3

[[intel.feeds]]
name = "Feodo Tracker C2"
url = "https://feodotracker.abuse.ch/downloads/ipblocklist.csv"
kind = "csv_ip"
column = "dst_ip"
file = "feodo.csv"

[[intel.feeds]]
name = "abuse.ch SSL Blacklist"
url = "https://sslbl.abuse.ch/blacklist/sslipblacklist.csv"
kind = "csv_ip"
column = "DstIP"
file = "sslbl.csv"

[[intel.feeds]]
name = "Spamhaus DROP"
url = "https://www.spamhaus.org/drop/drop.txt"
kind = "cidr_lines"
file = "spamhaus_drop.txt"

[[intel.feeds]]
name = "IPsum aggregate"
url = "https://raw.githubusercontent.com/stamparm/ipsum/master/ipsum.txt"
kind = "ipsum"
file = "ipsum.txt"

[[intel.feeds]]
name = "Tor exit nodes"
url = "https://raw.githubusercontent.com/SecOps-Institute/Tor-IP-Addresses/master/tor-exit-nodes.lst"
kind = "ip_lines"
file = "tor_exits.txt"

[[intel.feeds]]
name = "Blackbook malicious domains"
url = "https://raw.githubusercontent.com/stamparm/blackbook/master/blackbook.txt"
kind = "domain_lines"
file = "blackbook.txt"

[[intel.feeds]]
name = "OpenPhish"
url = "https://openphish.com/feed.txt"
kind = "url_lines"
file = "openphish.txt"

[virustotal]
# Optional. Add a VirusTotal API key to look up SHA-256 hashes of unsigned executables.
# Off while empty. Only hashes are sent, never files.
api_key = ""

[geo]
# DB-IP Lite city database (CC BY 4.0, https://db-ip.com). Downloaded automatically when missing.
mmdb = "data/geo/dbip-city-lite.mmdb"
download_url = "https://download.db-ip.com/free/dbip-city-lite-{YYYY}-{MM}.mmdb.gz"

[[intel.feeds]]
name = "CISA Known Exploited Vulnerabilities"
url = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
kind = "kev"
file = "kev.json"

[vuln]
# Look up CVEs for exact product versions through Shodan's free CVEDB after every inventory
# scan. Sends product names and version numbers, never files. Off by default; the Inventory
# view has a button to run it on demand.
online_lookup = false

[ai]
# Built-in analyst assistant ("explain this process / alert", "summarise my network").
# provider: free | auto | ollama | openai | anthropic | off
#   free      -> free web model (pollinations.ai), no account or key needed. Default.
#   auto      -> same as free.
#   ollama    -> local models. base_url defaults to http://127.0.0.1:11434; model is picked
#                from the installed models when empty (ollama pull gemma3 to get one).
#   openai    -> any OpenAI-compatible endpoint: Groq (https://api.groq.com/openai),
#                OpenRouter (https://openrouter.ai/api), Gemini
#                (https://generativelanguage.googleapis.com/v1beta/openai), LM Studio...
#   anthropic -> Claude API (model defaults to claude-opus-5-5).
# With a cloud provider the context (process names, hosts, alerts) is sent to that service.
provider = "free"
base_url = ""
model = ""
api_key = ""
