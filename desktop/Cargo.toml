[package]
name = "netmon-desktop"
version = "0.1.0"
edition = "2021"
description = "NetMonitor Command Center desktop app (Tauri window and tray around the shared netmon library)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
netmon = { path = ".." }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
