# SherWatch Command Center: CI check on every push/PR, installers on tags.
#
# The repository is private, so GitHub-hosted minutes count against the free quota
# (Linux 1x, Windows 2x, macOS 10x). The `check` job therefore only runs `cargo check`
# (no tests) and cancels superseded runs of the same ref. The `bundle` job builds the
# installers (Windows NSIS, macOS DMG for Apple Silicon and Intel, Linux deb + AppImage)
# only for `v*` tags or a manual run (Actions tab -> Build -> Run workflow, or
# `gh workflow run build.yml`). On tags the bundles are also attached to a DRAFT release.
#
# Local equivalent: `npx --prefix tools/npm tauri build` (see docs/BUILDING.md).

name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Linux build + runtime libraries for Tauri 2 (webkit2gtk 4.1, GTK 3, Ayatana AppIndicator for the tray).
  APT_PACKAGES: >-
    libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
    libgtk-3-dev libssl-dev build-essential curl wget file libxdo-dev
    libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

jobs:
  check:
    name: cargo check (${{ matrix.os }})
    # Tags are covered by the bundle job; do not pay for a second compile.
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-${{ matrix.os }}

      - name: cargo check
        run: cargo check --workspace --locked

  bundle:
    name: bundle (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: --bundles nsis
            bundles: |
              target/release/bundle/nsis/*.exe
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            args: --bundles dmg --target aarch64-apple-darwin
            bundles: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
            args: --bundles dmg --target x86_64-apple-darwin
            bundles: |
              target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles deb appimage
            bundles: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bundle-${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Tauri CLI is pinned in tools/npm/package-lock.json. --ignore-scripts skips
      # ffmpeg-static's binary download (only tools/make_video.py needs it).
      - name: Install Tauri CLI
        working-directory: tools/npm
        run: npm ci --ignore-scripts

      - name: Put the Tauri CLI on PATH
        shell: bash
        run: echo "${GITHUB_WORKSPACE}/tools/npm/node_modules/.bin" >> "$GITHUB_PATH"

      # projectPath is the directory holding tauri.conf.json; the CLI merges
      # tauri.<platform>.conf.json next to it (targets per OS, deb depends, DMG layout).
      # There is no JS build step: the lib serves the dashboard from the embedded server.
      - name: Build bundles
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: tauri
          args: ${{ matrix.args }}
          uploadUpdaterJson: false
          # Draft release on v* tags only; manual runs just produce workflow artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "SherWatch v__VERSION__"
          releaseDraft: true
          prerelease: false
          releaseBody: |
            SherWatch Command Center v__VERSION__ — per-process network monitoring and threat analysis.

            See the [User Guide](https://github.com/gokukhan/SherWatch/blob/master/docs/USER-GUIDE.md) for installation and first steps.

            **Downloads**
            - Windows 10/11 (x64): `SherWatch_<version>_x64-setup.exe` (NSIS installer, installs the WebView2 runtime if missing)
            - macOS 11+ Apple Silicon: `SherWatch_<version>_aarch64.dmg`; Intel: `SherWatch_<version>_x64.dmg`
            - Linux (x64, Debian/Ubuntu): `.deb` (needs `libwebkit2gtk-4.1-0` and `libayatana-appindicator3-1`); other distributions: `.AppImage`

            **These builds are not code-signed**
            - Windows SmartScreen shows "Windows protected your PC / unrecognised app": click *More info* then *Run anyway*.
            - macOS Gatekeeper reports the app as damaged or from an unidentified developer: right-click the app and choose *Open*, or run `xattr -d com.apple.quarantine /Applications/SherWatch.app`.
            - Per-process byte counts and DNS capture need administrator rights (Windows UAC prompt) or root (`sudo`, see `run.sh`) on macOS/Linux.

      - name: Upload bundles as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SherWatch-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 14
